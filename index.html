<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro de Pokemon</h1>
    <form action="#" method="post" id="IdFormulario">
        <label for="nome">Nome do Pokemon</label>
        <input type="text" id="nome">
        
        <label for="Dtreinador">Treinador</label>
        <input type="text" id="Dtreinador">

        <label for="tipo">Tipo</label>
        <input type="text" id="tipo">

        <label for="IDnivel">Nível(deve ser preenchido manualmente)</label>
        <input type="number" id="IDnivel">
        

        <label for="IDcp">Combat Power</label>
        <input type="number" id="IDcp">
        
        <label for="URLimagem">URL da imagem</label>
        <input type="URLimagem" id="IDUrl">
        

        <button type="submit" id="botao">Enviar</button>
        <button type="reset" id="botaolimpar">Limpar</button>
    </form>

    <div id="lista-cards" class="lista-card">

    </div>

    <p id="IdFeedback"></p>

    <script src="script.js"></script>
</body>
</html>
